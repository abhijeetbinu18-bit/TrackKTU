<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-labelledby="title desc">
  <title id="title">TrackKTU logo</title>
  <desc id="desc">TrackKTU logo inspired by the KTU crest with a faded shield and the word Track added above KTU.</desc>
  <defs>
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f64aa"/>
      <stop offset="100%" stop-color="#1f5d9b"/>
    </linearGradient>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b8f45"/>
      <stop offset="100%" stop-color="#857938"/>
    </linearGradient>
  </defs>

  <g opacity="0.18" transform="translate(8 5)">
    <path d="M128 6h72c26 0 47 21 47 47v15c0 42-29 66-83 106C112 134 83 110 83 68V53c0-26 21-47 45-47Z" fill="#f7f4ee"/>
    <path d="M128 6h72c26 0 47 21 47 47v14H83V53c0-26 21-47 45-47Z" fill="url(#shieldBlue)"/>
    <path d="M83 67h164v1c0 42-29 66-83 106C112 134 83 110 83 68Z" fill="url(#shieldGold)"/>
    <rect x="160" y="6" width="7" height="168" fill="#fbf9f4" opacity="0.8"/>
    <circle cx="164" cy="112" r="19" fill="#f7f4ee"/>
    <circle cx="164" cy="112" r="15" fill="none" stroke="#6f6558" stroke-width="1.2" opacity="0.35"/>
    <path d="M156 117h16v-10l-8-4-8 4Z" fill="#a02471" opacity="0.75"/>
  </g>

  <text x="36" y="50" font-family="Georgia, Times New Roman, serif" font-size="32" letter-spacing="1.4" fill="#315f9c">Track</text>
  <text x="32" y="95" font-family="Georgia, Times New Roman, serif" font-size="64" letter-spacing="-1" fill="#315f9c">KTU</text>
</svg>
